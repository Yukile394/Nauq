name: Build Nauq
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Derle
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Nauq-mod
          path: build/libs/nauq-1.0.0.jar
          if-no-files-found: error
      # gradle-wrapper.jar'i da uret (istersen repoya commit edersin)
      - name: Wrapper uret
        continue-on-error: true
        run: gradle wrapper --gradle-version 8.12
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: gradle-wrapper-files
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
